<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GST - Technician Log & Operations</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-blue: #38bdf8;
    }
    body {
      background-color: var(--bg-dark);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-bottom: 30px;
    }
    .navbar {
      background-color: #1e293b !important;
      border-bottom: 1px solid var(--border-color);
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }
    .form-control, .form-select {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: #f8fafc;
      border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0f172a;
      border-color: var(--accent-blue);
      color: #f8fafc;
      box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
    }
    .nav-pills .nav-link {
      color: #94a3b8;
      font-weight: 600;
      border-radius: 8px;
      padding: 10px 18px;
    }
    .nav-pills .nav-link.active {
      background-color: var(--accent-blue);
      color: #0f172a;
    }
    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
    }
    .btn-accent {
      background-color: var(--accent-blue);
      color: #0f172a;
      font-weight: 700;
    }
    .btn-accent:hover {
      background-color: #0284c7;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Top Navbar Header -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
    <div class="container-fluid px-3">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <i class="bi bi-tools text-info fs-4"></i>
        <div>
          <div class="fw-bold fs-6 lh-1">Golden Sands Tower</div>
          <small class="text-muted" style="font-size:0.75rem;">GST Facility Operations</small>
        </div>
      </a>
      <div class="d-flex align-items-center gap-2">
        <span id="syncBadge" class="badge bg-success-subtle text-success border border-success px-2 py-1 small">Online</span>
        <button id="logoutBtn" class="btn btn-sm btn-outline-light d-none" onclick="logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Sign Out
        </button>
      </div>
    </div>
  </nav>

  <!-- Login Gate Modal -->
  <div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-lg">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-bold text-info"><i class="bi bi-shield-lock me-2"></i>Technician Authentication</h5>
        </div>
        <div class="modal-body py-4">
          <div id="loginAlert" class="alert alert-danger d-none py-2 small"></div>
          <div class="mb-3">
            <label class="form-label text-slate-300 small fw-semibold">Technician Name</label>
            <select id="techSelect" class="form-select form-select-lg">
              <option value="">-- Select Your Name --</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label text-slate-300 small fw-semibold">Employee ID / PIN</label>
            <input type="password" id="pinInput" class="form-control form-control-lg" placeholder="Enter 4-digit PIN" maxlength="10">
          </div>
        </div>
        <div class="modal-footer border-top-0 pt-0">
          <button type="button" class="btn btn-accent w-100 py-2 fs-6" onclick="verifyLogin()">Sign In to Access Logs</button>
        </div>
      </div>
    </div>
  </div>

  <!-- App Main Content Container -->
  <div id="appContent" class="container mt-3" style="display: none;">
    
    <!-- User Welcome Banner -->
    <div class="d-flex justify-content-between align-items-center mb-3 px-1">
      <div>
        <small class="text-muted d-block">Logged in as:</small>
        <span id="activeTechDisplay" class="fw-bold text-info fs-5">Technician</span>
      </div>
      <a href="admin.html" class="btn btn-sm btn-outline-warning">
        <i class="bi bi-speedometer2 me-1"></i>Admin Portal
      </a>
    </div>

    <!-- Navigation Tabs -->
    <ul class="nav nav-pills nav-fill mb-3 gap-1 bg-slate-900 p-1 rounded-3" id="mainTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pills-job-tab" data-bs-toggle="pill" data-bs-target="#pills-job" type="button" role="tab">
          <i class="bi bi-journal-text me-1"></i>Job Log
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-utility-tab" data-bs-toggle="pill" data-bs-target="#pills-utility" type="button" role="tab">
          <i class="bi bi-speedometer me-1"></i>Utilities
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-ot-tab" data-bs-toggle="pill" data-bs-target="#pills-ot" type="button" role="tab">
          <i class="bi bi-clock-history me-1"></i>Overtime
        </button>
      </li>
    </ul>

    <!-- Tab Content Panels -->
    <div class="tab-content" id="mainTabsContent">
      
      <!-- TAB 1: JOB LOG ENTRY -->
      <div class="tab-pane fade show active" id="pills-job" role="tabpanel">
        <div class="card p-3 shadow-sm">
          <h6 class="text-info fw-bold mb-3 border-bottom border-secondary pb-2">
            <i class="bi bi-plus-circle me-1"></i>New Work Order / Job Entry
          </h6>
          <form id="jobForm" onsubmit="handleJobSubmit(event)">
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small mb-1">Date</label>
                <input type="date" id="logDate" class="form-control form-control-sm" required>
              </div>
              <div class="col-6">
                <label class="form-label small mb-1">Shift</label>
                <select id="shift" class="form-select form-select-sm">
                  <option value="Morning">Morning</option>
                  <option value="Evening">Evening</option>
                  <option value="Night">Night</option>
                </select>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small mb-1">Work Order (WO) #</label>
                <input type="text" id="wo" class="form-control form-control-sm" placeholder="WO Number">
              </div>
              <div class="col-6">
                <label class="form-label small mb-1">Location / Unit *</label>
                <input type="text" id="location" class="form-control form-control-sm" placeholder="e.g. Apt 102 / Common" required>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label small mb-1">Complaint / Work Request *</label>
              <textarea id="complaint" class="form-control form-control-sm" rows="2" placeholder="Details of complaint..." required></textarea>
            </div>

            <div class="mb-2">
              <label class="form-label small mb-1">Action Taken</label>
              <textarea id="action" class="form-control form-control-sm" rows="2" placeholder="Work performed..."></textarea>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small mb-1">Category</label>
                <select id="category" class="form-select form-select-sm"></select>
              </div>
              <div class="col-6">
                <label class="form-label small mb-1">Priority</label>
                <select id="priority" class="form-select form-select-sm"></select>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-4">
                <label class="form-label small mb-1">Received Time</label>
                <input type="time" id="received" class="form-control form-control-sm">
              </div>
              <div class="col-4">
                <label class="form-label small mb-1">Start Time</label>
                <input type="time" id="start" class="form-control form-control-sm">
              </div>
              <div class="col-4">
                <label class="form-label small mb-1">Finish Time</label>
                <input type="time" id="finish" class="form-control form-control-sm">
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label small mb-1">Materials Used</label>
              <input type="text" id="materials" class="form-control form-control-sm" placeholder="Spare parts / items used">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small mb-1">Status</label>
                <select id="status" class="form-select form-select-sm" onchange="togglePendingReason()"></select>
              </div>
              <div class="col-6" id="pendingWrapper">
                <label class="form-label small mb-1">Pending Reason / Remarks</label>
                <input type="text" id="pending" class="form-control form-control-sm" placeholder="Reason if pending">
              </div>
            </div>

            <button type="submit" class="btn btn-accent w-100 py-2 fs-6">
              <i class="bi bi-send me-1"></i>Submit Job Log
            </button>
          </form>
        </div>
      </div>

      <!-- TAB 2: UTILITY READINGS -->
      <div class="tab-pane fade" id="pills-utility" role="tabpanel">
        <div class="card p-3 shadow-sm">
          <h6 class="text-info fw-bold mb-3 border-bottom border-secondary pb-2">
            <i class="bi bi-speedometer2 me-1"></i>Utility Meter Reading Log
          </h6>
          <form id="utilityForm" onsubmit="handleUtilitySubmit(event)">
            <div class="mb-2">
              <label class="form-label small mb-1">Reading Date</label>
              <input type="date" id="readingDate" class="form-control form-control-sm" required>
            </div>

            <div class="mb-3">
              <label class="form-label small mb-1">Select Meter *</label>
              <select id="meterSelect" class="form-select form-select-sm" onchange="displayMeterInfo()" required>
                <option value="">-- Select Meter --</option>
              </select>
            </div>

            <div id="meterInfoCard" class="card bg-dark p-2 mb-3 d-none border-secondary">
              <div class="d-flex justify-content-between small">
                <span class="text-muted">Type: <strong id="infoType" class="text-info"></strong></span>
                <span class="text-muted">Area: <strong id="infoArea" class="text-light"></strong></span>
              </div>
              <div class="d-flex justify-content-between small mt-1">
                <span class="text-muted">Meter #: <strong id="infoMeter" class="text-light"></strong></span>
                <span class="text-muted">Account #: <strong id="infoAccount" class="text-light"></strong></span>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small mb-1">Current Reading Value *</label>
              <input type="number" step="any" id="meterValue" class="form-control form-control-lg" placeholder="Enter meter digits" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fs-6 fw-bold">
              <i class="bi bi-check-circle me-1"></i>Submit Utility Reading
            </button>
          </form>
        </div>
      </div>

      <!-- TAB 3: OVERTIME LOG -->
      <div class="tab-pane fade" id="pills-ot" role="tabpanel">
        <div class="card p-3 shadow-sm">
          <h6 class="text-info fw-bold mb-3 border-bottom border-secondary pb-2">
            <i class="bi bi-clock-history me-1"></i>Overtime Hours Entry
          </h6>
          <form id="otForm" onsubmit="handleOtSubmit(event)">
            <div class="mb-2">
              <label class="form-label small mb-1">Overtime Date</label>
              <input type="date" id="otDate" class="form-control form-control-sm" required>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small mb-1">From Time *</label>
                <input type="time" id="otFrom" class="form-control form-control-sm" required>
              </div>
              <div class="col-6">
                <label class="form-label small mb-1">To Time *</label>
                <input type="time" id="otTo" class="form-control form-control-sm" required>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small mb-1">Work Type / Reason</label>
                <input type="text" id="otType" class="form-control form-control-sm" placeholder="e.g. Emergency Repairs" required>
              </div>
              <div class="col-6">
                <label class="form-label small mb-1">Location / Area</label>
                <input type="text" id="otLocation" class="form-control form-control-sm" placeholder="Location details" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small mb-1">Work Accomplished *</label>
              <textarea id="otWork" class="form-control form-control-sm" rows="2" placeholder="Description of overtime work..." required></textarea>
            </div>

            <button type="submit" class="btn btn-warning w-100 py-2 fs-6 fw-bold text-dark">
              <i class="bi bi-clock me-1"></i>Submit Overtime Log
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let loginModalInstance;

    document.addEventListener("DOMContentLoaded", () => {
      loginModalInstance = new bootstrap.Modal(document.getElementById('loginModal'));
      setupDefaults();
      checkSession();
    });

    function setupDefaults() {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('logDate').value = today;
      document.getElementById('readingDate').value = today;
      document.getElementById('otDate').value = today;

      const techSelect = document.getElementById('techSelect');
      techSelect.innerHTML = '<option value="">-- Select Your Name --</option>';
      (CONFIG.TECHNICIANS || []).forEach(t => {
        techSelect.innerHTML += `<option value="${t}">${t}</option>`;
      });

      const cat = document.getElementById('category');
      (CONFIG.CATEGORIES || []).forEach(c => cat.innerHTML += `<option value="${c}">${c}</option>`);

      const pri = document.getElementById('priority');
      (CONFIG.PRIORITIES || []).forEach(p => pri.innerHTML += `<option value="${p}">${p}</option>`);

      const st = document.getElementById('status');
      (CONFIG.STATUSES || []).forEach(s => st.innerHTML += `<option value="${s}">${s}</option>`);

      const meterSelect = document.getElementById('meterSelect');
      (CONFIG.METERS || []).forEach((m, idx) => {
        meterSelect.innerHTML += `<option value="${idx}">${m.type} - ${m.area} (${m.meter})</option>`;
      });
    }

    function displayMeterInfo() {
      const idx = document.getElementById('meterSelect').value;
      const card = document.getElementById('meterInfoCard');
      if (idx === "") { card.classList.add('d-none'); return; }

      const m = CONFIG.METERS[idx];
      document.getElementById('infoType').textContent = m.type;
      document.getElementById('infoArea').textContent = m.area;
      document.getElementById('infoMeter').textContent = m.meter;
      document.getElementById('infoAccount').textContent = m.account;
      card.classList.remove('d-none');
    }

    function togglePendingReason() {
      const st = document.getElementById('status').value;
      const input = document.getElementById('pending');
      input.required = (st === "Pending" || st === "On Hold");
    }

    function checkSession() {
      const user = localStorage.getItem("tech_name");
      if (user) {
        document.getElementById('activeTechDisplay').textContent = user;
        document.getElementById('logoutBtn').classList.remove('d-none');
        document.getElementById('appContent').style.display = 'block';
        loginModalInstance.hide();
      } else {
        document.getElementById('logoutBtn').classList.add('d-none');
        document.getElementById('appContent').style.display = 'none';
        loginModalInstance.show();
      }
    }

    async function verifyLogin() {
      const name = document.getElementById('techSelect').value;
      const pin = document.getElementById('pinInput').value;
      const alertBox = document.getElementById('loginAlert');

      if (!name || !pin) {
        alertBox.textContent = "Select your name and enter PIN.";
        alertBox.classList.remove('d-none');
        return;
      }
      alertBox.classList.add('d-none');

      try {
        const url = `${CONFIG.SCRIPT_URL}?key=${encodeURIComponent(CONFIG.KEY)}&action=login&name=${encodeURIComponent(name)}&pin=${encodeURIComponent(pin)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.ok && data.valid) {
          localStorage.setItem("tech_name", name);
          localStorage.setItem("tech_pin", pin);
          document.getElementById('pinInput').value = "";
          checkSession();
        } else {
          alertBox.textContent = "Incorrect PIN or Employee ID.";
          alertBox.classList.remove('d-none');
        }
      } catch (e) {
        alertBox.textContent = "Server connection issue.";
        alertBox.classList.remove('d-none');
      }
    }

    function logout() {
      localStorage.removeItem("tech_name");
      localStorage.removeItem("tech_pin");
      checkSession();
    }

    async function handleJobSubmit(e) {
      e.preventDefault();
      const tech = localStorage.getItem("tech_name");
      const pin = localStorage.getItem("tech_pin");

      const entry = {
        id: "LOG-" + Date.now(),
        submittedAt: new Date().toISOString(),
        building: CONFIG.BUILDING || "GST1",
        supervisor: CONFIG.SUPERVISOR || "Ishan Madhushanka",
        logDate: document.getElementById('logDate').value,
        shift: document.getElementById('shift').value,
        wo: document.getElementById('wo').value,
        location: document.getElementById('location').value,
        complaint: document.getElementById('complaint').value,
        technician: tech,
        action: document.getElementById('action').value,
        category: document.getElementById('category').value,
        priority: document.getElementById('priority').value,
        received: document.getElementById('received').value,
        start: document.getElementById('start').value,
        finish: document.getElementById('finish').value,
        materials: document.getElementById('materials').value,
        status: document.getElementById('status').value,
        pending: document.getElementById('pending').value
      };

      try {
        const res = await fetch(CONFIG.SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ key: CONFIG.KEY, pin: pin, entries: [entry] })
        });
        const data = await res.json();
        if (data.ok) {
          alert("Job entry logged successfully!");
          document.getElementById('jobForm').reset();
          document.getElementById('logDate').value = new Date().toISOString().slice(0, 10);
        } else {
          alert("Error logging job: " + (data.error || "Invalid PIN"));
        }
      } catch (err) {
        alert("Server network error.");
      }
    }

    async function handleUtilitySubmit(e) {
      e.preventDefault();
      const tech = localStorage.getItem("tech_name");
      const pin = localStorage.getItem("tech_pin");
      const idx = document.getElementById('meterSelect').value;
      if (idx === "") return;
      const m = CONFIG.METERS[idx];

      const reading = {
        id: "RD-" + Date.now(),
        submittedAt: new Date().toISOString(),
        technician: tech,
        date: document.getElementById('readingDate').value,
        type: m.type,
        area: m.area,
        meter: m.meter,
        account: m.account,
        reading: document.getElementById('meterValue').value
      };

      try {
        const res = await fetch(CONFIG.SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ key: CONFIG.KEY, pin: pin, readings: [reading] })
        });
        const data = await res.json();
        if (data.ok) {
          alert("Meter reading recorded!");
          document.getElementById('utilityForm').reset();
          document.getElementById('readingDate').value = new Date().toISOString().slice(0, 10);
          document.getElementById('meterInfoCard').classList.add('d-none');
        } else {
          alert("Error: " + (data.error || "Invalid PIN"));
        }
      } catch (err) {
        alert("Server connection error.");
      }
    }

    async function handleOtSubmit(e) {
      e.preventDefault();
      const tech = localStorage.getItem("tech_name");
      const pin = localStorage.getItem("tech_pin");

      const ot = {
        id: "OT-" + Date.now(),
        submittedAt: new Date().toISOString(),
        technician: tech,
        otDate: document.getElementById('otDate').value,
        from: document.getElementById('otFrom').value,
        to: document.getElementById('otTo').value,
        type: document.getElementById('otType').value,
        location: document.getElementById('otLocation').value,
        work: document.getElementById('otWork').value
      };

      try {
        const res = await fetch(CONFIG.SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ key: CONFIG.KEY, pin: pin, overtime: [ot] })
        });
        const data = await res.json();
        if (data.ok) {
          alert("Overtime logged successfully!");
          document.getElementById('otForm').reset();
          document.getElementById('otDate').value = new Date().toISOString().slice(0, 10);
        } else {
          alert("Error: " + (data.error || "Invalid PIN"));
        }
      } catch (err) {
        alert("Server connection error.");
      }
    }
  </script>
</body>
</html>
