<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technician Log App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; font-family: sans-serif; }
    .header-bar { background-color: #0f2234; color: white; padding: 12px 16px; }
    .modal-backdrop.show { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- Header Bar -->
  <div class="header-bar d-flex justify-content-between align-items-center">
    <div>
      <h5 class="m-0">Maintenance Log</h5>
      <small id="userDisplay" class="text-light opacity-75">Not signed in</small>
    </div>
    <button id="switchUserBtn" class="btn btn-sm btn-outline-light" style="display:none;" onclick="logout()">Sign Out / Switch</button>
  </div>

  <div class="container my-4">
    <!-- Log Entry Form -->
    <div id="appContent" style="display:none;">
      <div class="card shadow-sm p-3 mb-4">
        <h6>New Maintenance Entry</h6>
        <form id="logForm" onsubmit="submitEntry(event)">
          <div class="mb-2">
            <label class="form-label">Work Order #</label>
            <input type="text" id="wo" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Location / Unit</label>
            <input type="text" id="location" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Complaint / Work Description</label>
            <textarea id="complaint" class="form-control" rows="2" required></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label">Category</label>
            <select id="category" class="form-select"></select>
          </div>
          <div class="mb-2">
            <label class="form-label">Status</label>
            <select id="status" class="form-select"></select>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-2">Submit Log</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title">Technician Sign In</h5>
        </div>
        <div class="modal-body">
          <div id="loginAlert" class="alert alert-danger d-none"></div>
          <div class="mb-3">
            <label for="techSelect" class="form-label">Select Your Name</label>
            <select id="techSelect" class="form-select">
              <option value="">-- Choose Name --</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="pinInput" class="form-label">Employee ID / PIN</label>
            <input type="password" id="pinInput" class="form-control" placeholder="Enter PIN">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary w-100" onclick="verifyLogin()">Sign In</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let loginModal;

    document.addEventListener("DOMContentLoaded", () => {
      loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
      populateOptions();
      checkAuth();
    });

    function populateOptions() {
      const select = document.getElementById('techSelect');
      select.innerHTML = '<option value="">-- Choose Name --</option>';
      (CONFIG.TECHNICIANS || []).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });

      const catSelect = document.getElementById('category');
      CONFIG.CATEGORIES.forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);

      const statSelect = document.getElementById('status');
      CONFIG.STATUSES.forEach(s => statSelect.innerHTML += `<option value="${s}">${s}</option>`);
    }

    function checkAuth() {
      const activeUser = localStorage.getItem("tech_name");
      if (activeUser) {
        document.getElementById('userDisplay').textContent = "Signed in: " + activeUser;
        document.getElementById('switchUserBtn').style.display = "inline-block";
        document.getElementById('appContent').style.display = "block";
        loginModal.hide();
      } else {
        document.getElementById('userDisplay').textContent = "Not signed in";
        document.getElementById('switchUserBtn').style.display = "none";
        document.getElementById('appContent').style.display = "none";
        loginModal.show();
      }
    }

    async function verifyLogin() {
      const name = document.getElementById('techSelect').value;
      const pin = document.getElementById('pinInput').value;
      const alertBox = document.getElementById('loginAlert');

      if (!name || !pin) {
        alertBox.textContent = "Please select your name and enter your PIN.";
        alertBox.classList.remove('d-none');
        return;
      }

      alertBox.classList.add('d-none');

      try {
        const url = `${CONFIG.SCRIPT_URL}?key=${encodeURIComponent(CONFIG.KEY)}&action=login&name=${encodeURIComponent(name)}&pin=${encodeURIComponent(pin)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.ok && data.valid) {
          localStorage.setItem("tech_name", name);
          localStorage.setItem("tech_pin", pin);
          document.getElementById('pinInput').value = "";
          checkAuth();
        } else {
          alertBox.textContent = "Invalid PIN or Employee ID. Please try again.";
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertBox.textContent = "Cannot reach server. Check network connection.";
        alertBox.classList.remove('d-none');
      }
    }

    function logout() {
      localStorage.removeItem("tech_name");
      localStorage.removeItem("tech_pin");
      checkAuth();
    }

    async function submitEntry(e) {
      e.preventDefault();
      const tech = localStorage.getItem("tech_name");
      const pin = localStorage.getItem("tech_pin");

      const entry = {
        id: "LOG-" + Date.now(),
        building: CONFIG.BUILDING,
        supervisor: CONFIG.SUPERVISOR,
        logDate: new Date().toISOString().slice(0, 10),
        technician: tech,
        wo: document.getElementById('wo').value,
        location: document.getElementById('location').value,
        complaint: document.getElementById('complaint').value,
        category: document.getElementById('category').value,
        status: document.getElementById('status').value
      };

      try {
        const res = await fetch(CONFIG.SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            key: CONFIG.KEY,
            pin: pin,
            entries: [entry]
          })
        });
        const data = await res.json();
        if (data.ok) {
          alert("Log submitted successfully!");
          document.getElementById('logForm').reset();
        } else {
          alert("Failed to submit log: " + (data.error || "Invalid PIN"));
        }
      } catch (err) {
        alert("Server error while submitting entry.");
      }
    }
  </script>
</body>
</html>
